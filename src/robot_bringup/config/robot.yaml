"/**":
  ros__parameters:
    use_sim_time: false

# 카메라: 전방 중앙 1대만 실행한다. 2대 구성 전환 시에만 camera_node_2 블록을 추가한다
# (robot_vision/config/vision.yaml 의 '(비활성) 2번 카메라' 주석 참고).
camera_node:
  ros__parameters:
    use_camera: true

#camera_node_2:
  #ros__parameters:
    #use_camera: false

apriltag_node:
  ros__parameters:
    enabled: false

qr_node:
  ros__parameters:
    enabled: true

detector_node:
  ros__parameters:
    enabled: true

pose_node:
  ros__parameters:
    enabled: false

# 사람 위험 판정 히스테리시스 + 급접근 주의 신호. 관찰용이며 Safety 정지 입력 연결은
# robot_safety/config/safety.yaml 의 use_vision_hazard(기본 false)로만 켠다.
hazard_monitor_node:
  ros__parameters:
    enabled: true

waypoint_follower_node:
  ros__parameters:
    enable_motion: false