# Gazebo 진단용 EKF 설정
#
# 입력: /wheel/odom의 vx, vy, yaw 각속도
# 출력: /odom 및 odom -> base_link TF
#
# IMU는 원인 분리를 위해 이 시험에서 제외한다.
# 실물용 최종 센서 융합 설정으로 사용하지 않는다.
#
# 토픽 이름은 localization launch에서 remapping한다.
# use_sim_time도 sim=true 실행 시 launch에서 덮어쓴다.

ekf_filter_node:
  ros__parameters:
    use_sim_time: false

    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: wheel/odom

    # 순서:
    # x,     y,      z
    # roll,  pitch,  yaw
    # vx,    vy,     vz
    # vroll, vpitch, vyaw
    # ax,    ay,     az
    #
    # 핵심 변경: vyaw를 true로 설정한다.
    # pose는 융합하지 않고 속도만 사용한다.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false