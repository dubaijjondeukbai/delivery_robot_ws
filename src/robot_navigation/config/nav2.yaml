# ============================================================
# nav2.yaml
# ROS 2 Lyrical / Nav2 1.5.1
#
# Dijkstra 전역 계획 + RPP 경로 추종
#
# 수치는 실물 검증 전 초기 시험값이다.
# footprint는 현재 URDF 모델 기준이며 실측 확인이 필요하다.
#
# 최종 속도 출력 토픽은 launch에서 결정한다.
# 현재 Safety Manager에 맞춰 geometry_msgs/Twist를 사용한다.
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    bt_log_idle_transitions: false

    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    # navigate_to_pose 의 BT 파일은 navigation.launch.py 가 default_nav_to_pose_bt_xml 로 넘긴다.
    # 기본: 이 패키지의 behavior_trees/nav_to_pose_replan_on_invalid_path.xml
    #       = Nav2 기본 트리 + INVALID_PATH(103) 시 현재 위치에서 재계획 + BackUp 제거.
    # navigate_through_poses 는 설치된 Nav2 기본 트리를 그대로 쓴다.


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.3

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    odom_topic: odom
    odom_duration: 0.3
    publish_zero_velocity: true
    enable_stamped_cmd_vel: false

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.15
      required_movement_angle: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
      enforce_path_inversion: false
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: false
      # max_robot_pose_search_dist 는 생략 시 로컬 코스트맵 긴 변/2 를 따른다 (6 m 창 → 3 m).
      # 남은 경로의 앞쪽 그 거리 안에서 로봇과 가장 가까운 점을 찾고, 그 점이 로컬 코스트맵
      # 창 밖이면 "Resulting plan has 0 poses in it." (FollowPath 103) 으로 실패한다.

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Lyrical의 RPP 속도/가속도 파라미터
      max_linear_vel: 0.3
      min_linear_vel: 0.0
      max_angular_vel: 0.5
      min_angular_vel: -0.5

      max_linear_accel: 0.3
      max_linear_decel: -0.5
      max_angular_accel: 0.8
      max_angular_decel: -1.5

      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false

      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      min_distance_to_obstacle: 0.0

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15

      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0

      # 아래 costmap inflation_layer와 일치시킨다.
      inflation_cost_scaling_factor: 3.0

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25

      use_cancel_deceleration: true
      cancel_deceleration: 0.5
      use_dynamic_window: false


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      # 3 m 창은 위치 추정이 1.5 m 만 튀어도 경로가 창 밖으로 나가 103 으로 실패한다.
      # 6 m 로 늘려 허용 점프를 3 m 로, RPP 충돌 검사 시야도 넓힌다 (0.05 m → 120x120 셀).
      width: 6
      height: 6
      resolution: 0.05

      # 현재 URDF 모델의 외곽
      # x: 차체 반길이 0.300
      # y: wheel_y + wheel_width/2 = 0.301
      #
      # robot_radius 대신 직사각형을 사용한다.
      # padding은 실물 시험 전 초기 여유값이다.
      footprint: "[[0.300, 0.301], [-0.300, 0.301], [-0.300, -0.301], [0.300, -0.301]]"
      footprint_padding: 0.02

      transform_tolerance: 0.3
      initial_transform_timeout: 300.0

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: scan
          sensor_frame: ""
          max_obstacle_height: 2.0

          clearing: true
          marking: true
          data_type: "LaserScan"

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0

        # 비용을 확장하는 범위이며,
        # 벽과 항상 이 거리만큼 떨어진다는 뜻은 아니다.
        inflation_radius: 0.55

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true

      # local_costmap과 동일하게 유지한다.
      footprint: "[[0.300, 0.301], [-0.300, 0.301], [-0.300, -0.301], [0.300, -0.301]]"
      footprint_padding: 0.02

      transform_tolerance: 0.5
      initial_transform_timeout: 300.0

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: map
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: scan
          sensor_frame: ""
          max_obstacle_height: 2.0

          clearing: true
          marking: true
          data_type: "LaserScan"

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5

      # false = Dijkstra
      use_astar: false
      allow_unknown: true


behavior_server:
  ros__parameters:
    use_sim_time: false

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    transform_tolerance: 0.1
    simulate_ahead_time: 2.0

    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8

    enable_stamped_cmd_vel: false

    # 복구 플러그인 등록과 최종 주행 허용은 별개이다.
    # 현재 Safety Manager의 후진 제한은 그대로 적용된다.


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    # [전후 선속도, 좌우 선속도, 각속도]
    max_velocity: [0.3, 0.0, 0.5]

    # 기존 Nav2 후진 범위.
    # 최종 Safety Manager에서는 현재 후진을 차단한다.
    min_velocity: [-0.1, 0.0, -0.5]

    max_accel: [0.3, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -1.5]

    odom_topic: odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false