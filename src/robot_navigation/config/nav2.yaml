# ~/delivery_robot_ws/src/robot_navigation/config/nav2.yaml
#
# Parameters for the Nav2 servers (navigation.launch.py).
# NOTE: numeric values (speeds, radii, tolerances) are deliberately conservative
#       initial values for a 30 kg robot -> TODO: tune on the real robot.
# NOTE: keep float parameters written with a decimal point (10.0, not 10).
# NOTE: written for Nav2 1.5 (ROS 2 Lyrical); notes for older distros are inline.
# NOTE: topic names are relative (scan, odom, map, cmd_vel) and remapped by the launch;
#       the final velocity topic (/cmd_vel_auto) is decided by the launch argument
#       motion_enabled, never here.

# =============================================================================
# Nav2 parameters — NAVIGATION MODE (navigation.launch.py)
#
#   /goal_pose ─► bt_navigator ─► planner_server (global costmap: /map + /scan) ─► path
#                      │
#                      └─────────► controller_server (local costmap: /scan) ─► cmd_vel ─┐
#                                  behavior_server (spin/backup/wait)    ─► cmd_vel ─┤ (remapped to cmd_vel_nav)
#                                                                                   ▼
#                                                                         velocity_smoother
#                                                                                   │ cmd_vel_smoothed
#                                        remapped by launch to /cmd_vel_auto  ◄─────┘   (motion_enabled:=true)
#                                        or to /cmd_vel_nav_dry_run (default: nobody listens)
#                                                                                   ▼
#                                                                      robot_safety (unchanged)
#
# Written for Nav2 1.5 (ROS 2 Lyrical). Notes for older distros are inline (Kilted/Jazzy/Humble).
# All speeds are deliberately low for a 30 kg robot whose drivetrain is not final.
# TODO: tune on real robot — every value marked below.
#
# Topic names inside this file are relative (scan, odom, map, cmd_vel) and are remapped by the launch.
# =============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10               # ms per BT tick
    default_server_timeout: 20         # ms
    wait_for_service_timeout: 1000     # ms
    # action_server_result_timeout was REMOVED in Lyrical; do not add it back.
    bt_log_idle_transitions: false     # Lyrical: silence the per-tick BT log spam
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # default_nav_to_pose_bt_xml is left at the default
    # (navigate_to_pose_w_replanning_and_recovery.xml: replanning at 1 Hz + spin/backup/wait recoveries).
    # plugin_lib_names: the default BT plugin libraries are loaded automatically since Iron; add only custom ones here.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0         # Hz. 20 is the default; 10 leaves CPU for AMCL + vision on the Pi 5. TODO: tune on real robot
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001    # odometry below this is treated as 0 (filters encoder noise)
    min_y_velocity_threshold: 0.5      # non-holonomic: ignore lateral odometry noise entirely
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3             # s the controller may throw before FollowPath fails -> BT recovery
    odom_topic: odom
    odom_duration: 0.3
    publish_zero_velocity: true        # SAFETY: a zero Twist is sent when a goal ends/aborts
    enable_stamped_cmd_vel: false      # Kilted+ default is true (TwistStamped). robot_safety consumes geometry_msgs/Twist.
    progress_checker_plugins: ["progress_checker"]   # Humble: progress_checker_plugin: "progress_checker" (singular, string)
    goal_checker_plugins: ["general_goal_checker"]
    path_handler_plugins: ["PathHandler"]            # Lyrical only; older distros ignore the whole PathHandler block
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5    # m the robot must move within movement_time_allowance, else "stuck" -> recovery
      movement_time_allowance: 10.0    # s
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True                   # once xy is reached only the heading is corrected (no re-approach wiggle)
      xy_goal_tolerance: 0.25          # m. TODO: tune on real robot (AprilTag docking does the fine alignment later)
      yaw_goal_tolerance: 0.25         # rad (~14 deg)
    PathHandler:                       # Lyrical: path pruning/inversion handling moved from the plugins to here
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
      enforce_path_inversion: False    # no reversing cusps planned (NavFn is holonomic-2D)
      enforce_path_rotation: False
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: False

    FollowPath:
      # Regulated Pure Pursuit: simple, predictable, cheap on CPU, slows down in curves and near
      # obstacles. Works for differential, skid-steer and (with use_rotate_to_heading: false)
      # Ackermann-like bases that accept a Twist. MPPI is better but too heavy for the Pi 5 alongside vision.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.3              # m/s. Lyrical name; Kilted and older: desired_linear_vel. TODO: tune on real robot
      lookahead_dist: 0.6              # m. Fixed look-ahead (use_velocity_scaled_lookahead_dist: false)
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.5   # rad/s when rotating in place. Keep low on a tall/heavy robot
      max_angular_accel: 1.0           # rad/s^2
      use_rotate_to_heading: true      # TODO: confirm drivetrain. Set false (and allow_reversing stays false) for Ackermann steering
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true    # projects the footprint along the arc and stops before hitting costmap obstacles
      max_allowed_time_to_collision_up_to_carrot: 1.0
      min_distance_to_obstacle: 0.0    # m. 0 disables; e.g. 0.5 to refuse motion within 0.5 m of an obstacle
      use_regulated_linear_velocity_scaling: true   # slow in tight curves
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true   # slow near obstacles (uses the inflation layer)
      cost_scaling_dist: 0.5           # must be <= inflation_radius below
      cost_scaling_gain: 1.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cancel_deceleration: true    # decelerate instead of stopping dead when a goal is cancelled
      cancel_deceleration: 0.5         # m/s^2
      use_dynamic_window: false        # Lyrical DWPP option; leave off until the base limits are known

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0            # Hz. TODO: tune on real robot
      publish_frequency: 2.0
      global_frame: odom               # local costmap lives in odom: smooth, unaffected by AMCL jumps
      robot_base_frame: base_link
      rolling_window: true
      width: 3                         # m
      height: 3
      resolution: 0.05
      robot_radius: 0.35               # m. TODO: measure the real robot (or replace by footprint: "[[x,y],...]")
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan                  # relative; remapped by the launch
          sensor_frame: ""             # taken from the LaserScan header (laser_link)
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0       # lower = cost decays slower = robot keeps more distance
        inflation_radius: 0.55         # m. >= robot_radius + desired clearance. TODO: tune on real robot
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35               # keep identical to local_costmap. TODO: measure
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: map                 # relative; remapped by the launch
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan
          sensor_frame: ""
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0    # Hz. Only used for a warning when replanning is slower than this
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn: fast Dijkstra/A* on the 2D costmap, lightest option for the Pi 5. Paths are holonomic
      # (no turning radius). For an Ackermann base switch to nav2_smac_planner::SmacPlannerHybrid.
      plugin: "nav2_navfn_planner::NavfnPlanner"   # Humble: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5                   # m. Accept a goal this far from an unreachable exact goal
      use_astar: false
      allow_unknown: true              # plan through unknown cells (exhibition halls are rarely fully mapped)

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"            # Humble: "nav2_behaviors/Spin" (same for the others)
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0           # s. Recovery motions are collision-checked this far ahead in the local costmap
    max_rotational_vel: 0.5            # rad/s. SAFETY: slow recoveries on a heavy robot. TODO: tune on real robot
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    enable_stamped_cmd_vel: false      # Twist for robot_safety

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0          # Hz output rate towards robot_safety
    scale_velocities: False
    feedback: "OPEN_LOOP"              # CLOSED_LOOP needs trustworthy, low-latency /odom; start open loop
    # [x, y, theta]. Must be >= the controller limits above (the smoother clips whatever exceeds them).
    max_velocity: [0.3, 0.0, 0.6]      # TODO: tune on real robot
    min_velocity: [-0.1, 0.0, -0.6]    # slow reverse only (needed by the BackUp recovery). Use [0.0, ...] to forbid reversing.
    max_accel: [0.3, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -1.5]       # braking may be stronger than acceleration
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0              # SAFETY: if no command arrives for 1 s, a zero velocity is published
    enable_stamped_cmd_vel: false      # Twist for robot_safety
