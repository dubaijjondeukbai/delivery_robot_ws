# ============================================================
# vision.yaml
# ============================================================
#
# 하드웨어:
#   Raspberry Pi Camera Module 3 일반형 2대
#
# 주의:
#   1. 이 파일은 설정만 제공한다. 노드를 자동 실행하지 않는다.
#   2. camera_node_2와 pose_node는 별도 실행 등록/launch가 필요하다.
#   3. 카메라의 장착 위치와 방향은 URDF/TF에서 설정한다.
#   4. robot_bringup/config/robot.yaml이 나중에 로드되면
#      이 파일의 일부 설정을 덮어쓸 수 있다.
#   5. 아래 수치는 실물 검증 전 초기 설정값이다.
#
# 자료형:
#   정수: 640, 480, 2
#   실수: 15.0, 1.0
#   논리: true, false
# ============================================================


# ============================================================
# 1번 카메라
# 기존 이름과 토픽을 유지한다.
# ============================================================
camera_node:
  ros__parameters:
    use_sim_time: false

    # false = 검은 테스트 영상 출력
    # true = 실제 카메라 사용
    # false는 노드를 끄는 설정이 아니다.
    use_camera: false

    # Camera Module 3의 CSI 입력
    camera_backend: picamera2
    camera_id: 0

    # 실물에서 확인한 Picamera2 Id를 입력하면
    # 번호 대신 해당 카메라를 선택한다.
    camera_unique_id: ""

    image_width: 640
    image_height: 480
    publish_rate_hz: 15.0

    frame_id: camera_optical_frame
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info

    # 현재 camera_node.py의 BGR 변환 처리와 대응한다.
    picamera2_format: RGB888
    picamera2_autofocus: true

    # 자동초점을 false로 설정했을 때 사용하는 값
    picamera2_lens_position: 0.0

    # 다른 입력 백엔드를 명시적으로 사용할 때만 설정한다.
    fourcc: ""
    gstreamer_pipeline: ""

    # 아직 보정하지 않은 상태
    # 실제 보정 전에는 임의의 내부 파라미터를 입력하지 않는다.
    calibration_width: 0
    calibration_height: 0

    intrinsics:
      fx: 0.0
      fy: 0.0
      cx: 0.0
      cy: 0.0

    distortion:
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0
      k3: 0.0

    # 보정된 CameraInfo를 사용하려면:
    # 고정 초점으로 보정한 뒤 해상도·내부 파라미터·왜곡값을
    # 입력하고 동일한 초점 설정을 유지해야 한다.
    #
    # 현재 자동초점/미보정 상태에서는
    # camera_node가 미보정 CameraInfo를 발행한다.

    reopen_after_failures: 15
    reopen_interval_sec: 2.0
    heartbeat_period_sec: 5.0


# ============================================================
# 2번 카메라 — 실행 연결 전 준비 설정
#
# camera_node 실행 파일을 camera_node_2라는 이름으로
# 실행해야 이 설정 블록이 적용된다.
#
# camera_id=1은 실물에서 반드시 확인한다.
# 번호는 전방/후방 위치를 의미하지 않는다.
#
# camera_2_optical_frame은 별도 프레임 이름이다.
# 공간 정보를 결합하기 전 실제 장착 위치에 맞는 TF가 필요하다.
# ============================================================
camera_node_2:
  ros__parameters:
    use_sim_time: false
    use_camera: false

    camera_backend: picamera2
    camera_id: 1
    camera_unique_id: ""

    image_width: 640
    image_height: 480
    publish_rate_hz: 15.0

    frame_id: camera_2_optical_frame
    image_topic: /camera_2/image_raw
    camera_info_topic: /camera_2/camera_info

    picamera2_format: RGB888
    picamera2_autofocus: true
    picamera2_lens_position: 0.0

    fourcc: ""
    gstreamer_pipeline: ""

    # 카메라마다 별도로 보정한다.
    # 1번 카메라의 보정값을 그대로 복사하지 않는다.
    calibration_width: 0
    calibration_height: 0

    intrinsics:
      fx: 0.0
      fy: 0.0
      cx: 0.0
      cy: 0.0

    distortion:
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0
      k3: 0.0

    reopen_after_failures: 15
    reopen_interval_sec: 2.0
    heartbeat_period_sec: 5.0


# ============================================================
# AprilTag
# 기존 마스터 설정과 맞춰 기본 비활성화한다.
# ============================================================
apriltag_node:
  ros__parameters:
    use_sim_time: false
    enabled: false

    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info

    tag_id_topic: /vision/tag_id
    tag_pose_topic: /vision/tag_pose

    tag_family: tag36h11

    # 임시값: 사용 전 출력한 태그의 검은 정사각형 변을 실측한다.
    tag_size: 0.15

    # -1 = 화면에서 가장 크게 보이는 태그 선택
    target_tag_id: -1

    max_tag_distance_m: 10.0

    publish_debug_image: false
    debug_image_topic: /vision/apriltag_debug_image

    calibration_warning_period_sec: 10.0
    heartbeat_period_sec: 5.0


# ============================================================
# QR 인식
# ============================================================
qr_node:
  ros__parameters:
    use_sim_time: false
    enabled: true

    image_topic: /camera/image_raw
    qr_result_topic: /vision/qr_result

    # 같은 문자열의 반복 발행을 제한한다.
    repeat_suppression_sec: 1.0

    # CPU 절약용 초기값
    # 이동 중에도 QR을 놓치지 않는지 실물에서 확인한다.
    process_every_n_frames: 3

    use_multi_decode: true
    use_aruco_detector: false

    heartbeat_period_sec: 5.0


# ============================================================
# YOLO 객체 탐지
# ============================================================
detector_node:
  ros__parameters:
    use_sim_time: false
    enabled: true

    # 실물 배포 시에는 확인한 모델 파일의 절대경로 사용을 권장한다.
    model_path: yolo11n.pt
    device: cpu

    imgsz: 416
    confidence_threshold: 0.40
    iou_threshold: 0.50
    max_detections: 20

    # 기존 사람·차량 필터 대신 모델의 전체 클래스를 사용한다.
    # 모든 종류의 장애물을 인식한다는 의미는 아니다.
    classes: [-1]

    image_topic: /camera/image_raw
    detections_topic: /vision/detections

    publish_annotated_image: false
    annotated_image_topic: /vision/debug_image

    # 목표 호출 주기이며 실제 처리 속도를 보장하지 않는다.
    inference_rate_hz: 5.0

    # Pi의 다른 노드와 자원을 나누기 위한 초기값
    cpu_threads: 2

    warmup: true
    use_class_names: false

    # 수신 후 처리 가능한 최대 경과 시간
    image_timeout_sec: 1.0

    # 원본 영상 stamp부터 결과 발행까지 허용하는 최대 시간
    # 추론 전과 추론 후 모두 검사한다.
    max_image_age_sec: 1.0

    future_tolerance_sec: 0.1

    # 영상 단절 또는 추적 관측 공백 시 초기화 기준
    tracker_reset_gap_sec: 1.0

    model_retry_sec: 5.0
    heartbeat_period_sec: 5.0


# ============================================================
# 사람 Pose
#
# 기존 pose_node.py가 DetectorNode(pose_mode=True)를 사용한다.
# 실행 파일 등록은 다음 setup.py 단계에서 확인한다.
#
# 객체 탐지와 Pose의 추적 ID는 서로 독립적이다.
# 동일 인물이라고 ID를 직접 대응시키면 안 된다.
# ============================================================
pose_node:
  ros__parameters:
    use_sim_time: false

    # 객체 탐지의 실물 부하를 먼저 측정한 뒤 활성화한다.
    enabled: false

    model_path: yolo11n-pose.pt
    device: cpu

    imgsz: 416
    confidence_threshold: 0.40
    iou_threshold: 0.50
    max_detections: 20
    classes: [0]

    image_topic: /camera/image_raw
    detections_topic: /vision/pose_boxes
    poses_topic: /vision/poses

    publish_annotated_image: false
    annotated_image_topic: /vision/pose_debug_image

    inference_rate_hz: 2.0
    cpu_threads: 2

    warmup: true
    use_class_names: false

    image_timeout_sec: 1.0
    max_image_age_sec: 1.0
    future_tolerance_sec: 0.1
    tracker_reset_gap_sec: 1.0
    model_retry_sec: 5.0
    heartbeat_period_sec: 5.0