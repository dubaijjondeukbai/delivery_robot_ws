# ============================================================
# vision.yaml
# ============================================================
#
# 하드웨어 (2026-11-01 기준):
#   Raspberry Pi Camera Module 3 1대 — 로봇 전방 중앙(전면 하단 범퍼).
#   TODO(확인): 일반형인지 Wide 인지(README 는 Wide 로 적혀 있음).
#   향후 2대(전방 좌우 '눈' 배치)는 아래 '(비활성) 2번 카메라' 주석 절차로만 전환한다.
#
# 주의:
#   1. 이 파일은 설정만 제공한다. 노드는 robot_bringup/launch/robot.launch.py 가 실행한다.
#   2. 기본 실행은 카메라 1대(camera_node)만 시작한다. camera_node_2 블록은 주석이다.
#   3. 카메라의 장착 위치와 방향은 URDF/TF에서 설정한다(robot_description/urdf/robot_params.xacro).
#      영상 header.frame_id(camera_optical_frame)는 URDF 의 optical frame 이름과 같아야 한다.
#   4. robot_bringup/config/robot.yaml이 나중에 로드되면
#      이 파일의 일부 설정을 덮어쓸 수 있다.
#   5. 아래 수치는 실물 검증 전 초기 설정값이다.
#
# 자료형:
#   정수: 640, 480, 2
#   실수: 15.0, 1.0
#   논리: true, false
# ============================================================


# ============================================================
# 전방 중앙 카메라 (현재 유일한 카메라)
# 토픽/frame 은 Gazebo 센서(gazebo.xacro)·bridge.yaml·URDF 와 같다:
#   /camera/image_raw, /camera/camera_info, camera_optical_frame
# 2대 구성으로 바꾸면 이 블록이 '좌측' 카메라가 된다(이름·토픽은 유지).
# ============================================================
camera_node:
  ros__parameters:
    use_sim_time: false

    # false = 검은 테스트 영상 출력
    # true = 실제 카메라 사용
    # false는 노드를 끄는 설정이 아니다.
    use_camera: false

    # Camera Module 3의 CSI 입력
    camera_backend: picamera2
    camera_id: 0

    # 실물에서 확인한 Picamera2 Id를 입력하면
    # 번호 대신 해당 카메라를 선택한다.
    camera_unique_id: ""

    image_width: 640
    image_height: 480
    publish_rate_hz: 15.0

    frame_id: camera_optical_frame
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info

    # 현재 camera_node.py의 BGR 변환 처리와 대응한다.
    picamera2_format: RGB888
    picamera2_autofocus: true

    # 자동초점을 false로 설정했을 때 사용하는 값
    picamera2_lens_position: 0.0

    # 다른 입력 백엔드를 명시적으로 사용할 때만 설정한다.
    fourcc: ""
    gstreamer_pipeline: ""

    # 아직 보정하지 않은 상태
    # 실제 보정 전에는 임의의 내부 파라미터를 입력하지 않는다.
    calibration_width: 0
    calibration_height: 0

    intrinsics:
      fx: 0.0
      fy: 0.0
      cx: 0.0
      cy: 0.0

    distortion:
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0
      k3: 0.0

    # 보정된 CameraInfo를 사용하려면:
    # 고정 초점으로 보정한 뒤 해상도·내부 파라미터·왜곡값을
    # 입력하고 동일한 초점 설정을 유지해야 한다.
    #
    # 현재 자동초점/미보정 상태에서는
    # camera_node가 미보정 CameraInfo를 발행한다.

    reopen_after_failures: 15
    reopen_interval_sec: 2.0
    heartbeat_period_sec: 5.0


# ============================================================
# (비활성) 2번 카메라 = 2대 구성의 '우측' 카메라 — 주석 예시만 둔다
#
# 전환 절차
#   1. URDF: robot_params.xacro 의 전환 절차대로 중앙 카메라를 좌측으로 옮기고
#      camera_2_link / camera_2_optical_frame 을 추가한다(좌우 간격·높이는 실측값).
#   2. 이 파일: 아래 camera_node_2 예시의 주석을 푼다. 1번(camera_node)은 좌측이 된다.
#   3. launch: robot_bringup/launch/robot.launch.py 의 '2대 구성' 주석대로
#      camera_node 를 name='camera_node_2' 로 한 번 더 실행한다(현재는 거부하도록 되어 있음).
#   4. robot_bringup/config/robot.yaml 에 camera_node_2 블록을 추가한다(use_camera 등).
#
# 카메라별로 반드시 달라야 하는 것
#   - 고유 ID: camera_unique_id 에 Picamera2.global_camera_info() 의 'Id' 를 각각 넣는다
#     (CSI 포트마다 다름). 번호(camera_id 0/1)는 연결 순서일 뿐 좌/우를 뜻하지 않는다.
#   - 보정값: 카메라마다 따로 보정한다. 1번 값을 복사하지 않는다. 같은 해상도·고정 초점에서 보정.
#   - optical frame: camera_2_optical_frame (URDF 에 TF 가 있어야 함).
#   - 토픽: /camera_2/image_raw, /camera_2/camera_info.
#
# 영상 동기화 조건 (두 영상을 함께 쓰는 처리를 만들 때)
#   - 지금 camera_node 의 stamp 는 호스트가 프레임을 받은 시각이며 두 카메라의 노출 동기를
#     보장하지 않는다(카메라는 각자 free-run).
#   - 함께 쓰려면: 같은 해상도·프레임레이트·노출 모드, stamp 를 센서 노출 시각(Picamera2
#     메타데이터 SensorTimestamp)으로 바꾸기, message_filters ApproximateTime 로 짝짓되
#     허용 오차(slop)는 프레임 간격의 절반 이하(15 fps 면 33 ms 이하)로 두고, 짝이 안 맞는
#     프레임은 버린다. 하드웨어/libcamera 동기화 사용 여부는 실물에서 확인(TODO).
#   - 동기 조건을 만족하기 전에는 두 영상을 하나의 거리 추정(스테레오 등)에 쓰지 않는다.
#
# 예시 (값은 1번과 같은 형식, 보정값·ID 는 실물에서 채운다):
#
# camera_node_2:
#   ros__parameters:
#     use_sim_time: false
#     use_camera: false
#     camera_backend: picamera2
#     camera_id: 1                      # 연결 순서 번호(좌/우 아님)
#     camera_unique_id: ""              # TODO: 우측 카메라의 Picamera2 'Id'
#     image_width: 640
#     image_height: 480
#     publish_rate_hz: 15.0
#     frame_id: camera_2_optical_frame
#     image_topic: /camera_2/image_raw
#     camera_info_topic: /camera_2/camera_info
#     picamera2_format: RGB888
#     picamera2_autofocus: true
#     picamera2_lens_position: 0.0
#     fourcc: ""
#     gstreamer_pipeline: ""
#     calibration_width: 0              # TODO: 우측 카메라 자체 보정값
#     calibration_height: 0
#     intrinsics: {fx: 0.0, fy: 0.0, cx: 0.0, cy: 0.0}
#     distortion: {k1: 0.0, k2: 0.0, p1: 0.0, p2: 0.0, k3: 0.0}
#     reopen_after_failures: 15
#     reopen_interval_sec: 2.0
#     heartbeat_period_sec: 5.0
# ============================================================


# ============================================================
# AprilTag
# 기존 마스터 설정과 맞춰 기본 비활성화한다.
# ============================================================
apriltag_node:
  ros__parameters:
    use_sim_time: false
    enabled: false

    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info

    tag_id_topic: /vision/tag_id
    tag_pose_topic: /vision/tag_pose

    tag_family: tag36h11

    # 임시값: 사용 전 출력한 태그의 검은 정사각형 변을 실측한다.
    tag_size: 0.15

    # -1 = 화면에서 가장 크게 보이는 태그 선택
    target_tag_id: -1

    max_tag_distance_m: 10.0

    publish_debug_image: false
    debug_image_topic: /vision/apriltag_debug_image

    calibration_warning_period_sec: 10.0
    heartbeat_period_sec: 5.0


# ============================================================
# QR 인식
# ============================================================
qr_node:
  ros__parameters:
    use_sim_time: false
    enabled: true

    image_topic: /camera/image_raw
    qr_result_topic: /vision/qr_result

    # 같은 문자열의 반복 발행을 제한한다.
    repeat_suppression_sec: 1.0

    # CPU 절약용 초기값
    # 이동 중에도 QR을 놓치지 않는지 실물에서 확인한다.
    process_every_n_frames: 3

    use_multi_decode: true
    use_aruco_detector: false

    heartbeat_period_sec: 5.0


# ============================================================
# YOLO 객체 탐지
# ============================================================
detector_node:
  ros__parameters:
    use_sim_time: false
    enabled: true

    # 실물 배포 시에는 확인한 모델 파일의 절대경로 사용을 권장한다.
    model_path: yolo11n.pt
    device: cpu

    imgsz: 416
    confidence_threshold: 0.40
    iou_threshold: 0.50
    max_detections: 20

    # 기존 사람·차량 필터 대신 모델의 전체 클래스를 사용한다.
    # 모든 종류의 장애물을 인식한다는 의미는 아니다.
    classes: [-1]

    image_topic: /camera/image_raw
    detections_topic: /vision/detections

    publish_annotated_image: false
    annotated_image_topic: /vision/debug_image

    # 목표 호출 주기이며 실제 처리 속도를 보장하지 않는다.
    inference_rate_hz: 5.0

    # Pi의 다른 노드와 자원을 나누기 위한 초기값
    cpu_threads: 2

    warmup: true
    use_class_names: false

    # 수신 후 처리 가능한 최대 경과 시간
    image_timeout_sec: 1.0

    # 원본 영상 stamp부터 결과 발행까지 허용하는 최대 시간
    # 추론 전과 추론 후 모두 검사한다.
    max_image_age_sec: 1.0

    future_tolerance_sec: 0.1

    # 영상 단절 또는 추적 관측 공백 시 초기화 기준
    tracker_reset_gap_sec: 1.0

    model_retry_sec: 5.0
    heartbeat_period_sec: 5.0


# ============================================================
# 사람 Pose
#
# 기존 pose_node.py가 DetectorNode(pose_mode=True)를 사용한다.
# 실행 파일 등록은 다음 setup.py 단계에서 확인한다.
#
# 객체 탐지와 Pose의 추적 ID는 서로 독립적이다.
# 동일 인물이라고 ID를 직접 대응시키면 안 된다.
# ============================================================
pose_node:
  ros__parameters:
    use_sim_time: false

    # 객체 탐지의 실물 부하를 먼저 측정한 뒤 활성화한다.
    enabled: false

    model_path: yolo11n-pose.pt
    device: cpu

    imgsz: 416
    confidence_threshold: 0.40
    iou_threshold: 0.50
    max_detections: 20
    classes: [0]

    image_topic: /camera/image_raw
    detections_topic: /vision/pose_boxes
    poses_topic: /vision/poses

    publish_annotated_image: false
    annotated_image_topic: /vision/pose_debug_image

    inference_rate_hz: 2.0
    cpu_threads: 2

    warmup: true
    use_class_names: false

    image_timeout_sec: 1.0
    max_image_age_sec: 1.0
    future_tolerance_sec: 0.1
    tracker_reset_gap_sec: 1.0
    model_retry_sec: 5.0
    heartbeat_period_sec: 5.0


# ============================================================
# 사람 위험 판정 히스테리시스 + 급접근 주의 신호 (hazard_monitor_node)
#
# 입력 /vision/detections(사람 클래스), 출력:
#   /vision/person_hazard (Bool)   HAZARD 또는 STALE(+stale_is_hazard) 이면 True
#   /vision/hazard_state  (String) JSON: 상태·사유·트랙별 화면상 단서·카운터
#
# 진입은 지연 없음(한 프레임이라도 조건 충족 시 즉시), 해제는 clear_frames + clear_sec,
# 검출 누락 유예(miss_grace_sec), 추적 ID 변경 이어 붙이기, 입력 단절 시 STALE.
# 모든 좌표는 영상 정규화 좌표(0~1)이며 미보정 단안 카메라 기준의 '화면상' 값이다.
# 거리·m/s·충돌 시간을 계산하지 않는다. 아래 영역/크기 값은 TODO: 실물 장착 후 맞춘다.
#
# robot_safety 는 safety.yaml 의 use_vision_hazard: true 일 때만 이 출력을 정지 입력으로 쓴다
# (기본 false = 관찰만).
# ============================================================
hazard_monitor_node:
  ros__parameters:
    use_sim_time: false
    enabled: true

    detections_topic: /vision/detections
    camera_info_topic: /camera/camera_info
    hazard_topic: /vision/person_hazard
    state_topic: /vision/hazard_state
    publish_rate_hz: 10.0
    heartbeat_period_sec: 5.0

    # camera_info 가 없을 때 쓰는 영상 크기
    image_width: 640
    image_height: 480

    # detector_node use_class_names=false 면 "0", true 면 "person"
    person_class_ids: ["0", "person"]
    min_score: 0.40

    # 로봇 정면 통로가 화면에 보이는 사다리꼴(정규화 x,y 순서쌍을 펼친 목록).
    # TODO(실물): 카메라 높이·pitch 실측 후 로봇 폭이 바닥에 닿는 선으로 다시 그린다.
    path_zone: [0.15, 1.00, 0.85, 1.00, 0.62, 0.55, 0.38, 0.55]
    path_zone_exit_margin: 0.05

    # '가까움' 화면 프록시: bbox 높이/영상 높이(진입 > 해제), 머리가 잘리면 발 위치 y 사용
    near_height_enter: 0.45
    near_height_exit: 0.35
    near_foot_y_enter: 0.60
    near_foot_y_exit: 0.57

    # 해제(두 조건 모두): 연속 clear 프레임 수와 시간
    clear_frames: 5
    clear_sec: 1.0
    # 위험 판정을 받은 사람이 검출에서 사라져도 이 시간 동안은 있다고 본다
    miss_grace_sec: 0.5
    track_drop_sec: 2.0
    # 주의 신호용 트랙 확인 관측 수(위험 진입에는 적용하지 않음)
    confirm_frames: 3
    # 검출 메시지가 이 시간 이상 없으면 STALE
    input_timeout_sec: 1.0
    stale_is_hazard: true
    # 추적 ID 가 바뀐 같은 사람 이어 붙이기
    id_switch_iou: 0.3
    id_switch_max_gap_sec: 1.0

    # 급접근(보행자가 경로 쪽으로 뛰어듦) 화면상 주의 신호 — Safety 입력 아님
    approach_window_sec: 1.2
    approach_min_obs: 4
    approach_min_span_sec: 0.4
    lateral_speed_watch: 0.15      # 영상 폭/s
    lateral_speed_alert: 0.30      # 영상 폭/s
    expansion_rate_watch: 0.25     # d ln(bbox 높이)/dt, 1/s
    expansion_rate_alert: 0.50
    min_r2: 0.5
    attention_hold_sec: 1.0
    # 로봇 자신의 움직임: /odom(EKF) 우선, 없으면 /cmd_vel_safe
    ego_odom_topic: /odom
    ego_cmd_topic: /cmd_vel_safe
    ego_timeout_sec: 0.5
    nominal_hfov_deg: 66.0         # 미보정 공칭값, yaw 로 인한 화면 이동의 근사 보정용
    max_ego_yaw_rate: 0.25         # rad/s 초과 시 수평 이동 신호 불신
    max_ego_speed_for_expansion: 0.05   # m/s 초과 시 확대율 신호 불신

    # Pose 발목 키포인트로 발 위치 보정(보조). pose_node 가 꺼져 있으면 의미 없음.
    poses_topic: /vision/poses
    use_pose_keypoints: false
